name: aspire91
description: Aspire91 mobile — one codebase, two flavors (seeker, provider).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Auth, realtime and Storage go straight to Supabase. PLAN.md keeps those two
  # doors open on purpose: realtime is websockets with RLS per connection, and
  # file bytes should not be forwarded through the API.
  supabase_flutter: ^2.5.6

  # Everything else goes through api.aspire91.com via the generated client.
  dio: ^5.4.0

  # State, routing and DI. GetX is a framework rather than a state library, so
  # it owns navigation too — which is why go_router is deliberately absent.
  # Confined to the presentation layer: nothing under lib/src/data imports it.
  get: ^4.7.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
