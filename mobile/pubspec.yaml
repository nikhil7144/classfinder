name: aspire91
description: Aspire91 mobile — one codebase, two flavors (seeker, provider).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Auth, realtime and Storage go straight to Supabase. PLAN.md keeps those two
  # doors open on purpose: realtime is websockets with RLS per connection, and
  # file bytes should not be forwarded through the API.
  supabase_flutter: ^2.5.6

  # Everything else goes through api.aspire91.com via the generated client.
  dio: ^5.4.0

  # State and dependency injection. Written by hand rather than with
  # riverpod_generator: a provider you can read is worth more here than one
  # build_runner writes, particularly to somebody meeting Riverpod on this
  # codebase for the first time.
  #
  # Confined to the presentation layer. Nothing under lib/src/data imports it,
  # so the API client, the Supabase layer and the repositories stay pure Dart.
  flutter_riverpod: ^3.4.3

  # Routing. Riverpod does not own navigation, so this is a separate choice.
  go_router: ^14.0.0

  google_fonts: ^6.2.1

  # Picking a profile photo off the camera roll or out of the camera. The
  # bytes go straight to Storage from there — see ListingRepository.
  image_picker: ^1.1.2

  # Dialling a parent who asked to be rung, and opening a Space post's video
  # on YouTube. A "parents who want a call" screen that cannot place the call
  # is not the feature.
  url_launcher: ^6.3.1

  # "Use my location", on the profile and on search. Optional in both places —
  # the area's centroid is the fallback and the web says so in as many words —
  # so nothing breaks if a parent refuses the permission.
  geolocator: ^13.0.2

  # Sending a group's invite link. The web copies it to the clipboard; a phone
  # hands it to WhatsApp, which is where a building group actually lives.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Copied from the web build rather than re-exported, so the two clients
    # cannot drift apart on the mark. The wordmark is the cropped one — the
    # full lockup carries the tagline, which is illegible below about 200px.
    - assets/brand/
