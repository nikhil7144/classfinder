name: aspire91
description: Aspire91 mobile — one codebase, two flavors (seeker, provider).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Auth, realtime and Storage go straight to Supabase. PLAN.md keeps those two
  # doors open on purpose: realtime is websockets with RLS per connection, and
  # file bytes should not be forwarded through the API.
  supabase_flutter: ^2.5.6

  # Everything else goes through api.aspire91.com via the generated client.
  dio: ^5.4.0

  # State and dependency injection. Written by hand rather than with
  # riverpod_generator: a provider you can read is worth more here than one
  # build_runner writes, particularly to somebody meeting Riverpod on this
  # codebase for the first time.
  #
  # Confined to the presentation layer. Nothing under lib/src/data imports it,
  # so the API client, the Supabase layer and the repositories stay pure Dart.
  flutter_riverpod: ^3.4.3

  # Routing. Riverpod does not own navigation, so this is a separate choice.
  go_router: ^14.0.0

  google_fonts: ^6.2.1

  # Picking a profile photo off the camera roll or out of the camera. The
  # bytes go straight to Storage from there — see ListingRepository.
  image_picker: ^1.1.2

  # Dialling a parent who asked to be rung, and opening a Space post's video
  # on YouTube. A "parents who want a call" screen that cannot place the call
  # is not the feature.
  url_launcher: ^6.3.1

  # "Use my location", on the profile and on search. Optional in both places —
  # the area's centroid is the fallback and the web says so in as many words —
  # so nothing breaks if a parent refuses the permission.
  geolocator: ^13.0.2

  # Sending a group's invite link. The web copies it to the clipboard; a phone
  # hands it to WhatsApp, which is where a building group actually lives.
  share_plus: ^10.1.4

  # Native Google sign-in — the platform picker, never a webview, which
  # Google blocks for OAuth. Does nothing until GOOGLE_WEB_CLIENT_ID is
  # supplied; see AuthRepository.googleSignInAvailable and README §7/§10.4.
  google_sign_in: ^6.3.0

  # Renders GoogleMark's exact SVG paths from components/AuthForm.tsx, so the
  # sign-in button carries Google's actual four-colour mark like the web
  # does, rather than a hand-ported approximation of it.
  flutter_svg: ^2.3.0

  # Persists the Light/Dark/System choice — mobile's equivalent of the web's
  # localStorage cf-theme key. Read once in main(), before runApp(), so the
  # first frame already paints the right ground; the web gets the same
  # guarantee from ThemeScript's blocking inline script.
  shared_preferences: ^2.3.2

  # Push notifications — see README §11 and lib/src/push.dart. Firebase.
  # initializeApp() is wrapped in try/catch at startup, so an install built
  # before google-services.json exists for a flavor keeps working exactly
  # as before; push simply stays off until that file is added.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Foreground display only. FCM does not show a notification itself while
  # the app is open on either platform — it hands the payload to onMessage
  # and expects the app to decide. Without this, a message arriving while
  # someone is looking at another tab is silently dropped.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Run once with `dart run flutter_launcher_icons` whenever aspire_app_logo
  # changes — it writes every mipmap-*/ic_launcher.png and every
  # AppIcon.appiconset entry directly, so nothing here ships in the app
  # bundle itself.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Copied from the web build rather than re-exported, so the two clients
    # cannot drift apart on the mark.
    - assets/brand/

# The square "A91" mark, not the wordmark — a launcher icon is shown small
# and round-cropped on some launchers, and the wordmark's "Aspire91" text
# would be illegible at that size. Same icon for both flavors: nothing here
# distinguishes seeker from provider, matching how android/app/build.gradle.kts
# only overrides the label (@string/app_name) per flavor, not the icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/aspire_app_logo.jpeg"
